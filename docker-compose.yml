version: '3'
services:
  sql-query-analyzer:
    build: .
    environment:
      - DB_SERVER=localhost
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=YourPassword123!
      - DB_NAME=QueryAnalyzer
      - ANALYZER_LOG_LEVEL=Information
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["curl", "--fail", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - redis
      - postgres
  redis:
    image: redis:alpine
    volumes:
      - ./redis-data:/data
  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourPassword123!
      - POSTGRES_DB=QueryAnalyzer
    volumes:
      - ./postgres-data:/var/lib/postgresql/data