name: Publish Release

on:
  release:
    types: [published]

jobs:
  publish-nuget:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Create NuGet package
        run: dotnet pack --configuration Release --no-build

      - name: Publish to NuGet
        run: dotnet nuget push **/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  publish-docker:
    runs-on: ubuntu-latest
    needs: publish-nuget

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sql-query-analyzer:latest
            ${{ secrets.DOCKER_USERNAME }}/sql-query-analyzer:${{ github.event.release.tag_name }}

  create-release-artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: dotnet restore && dotnet build --configuration Release

      - name: Publish for Windows
        run: dotnet publish --configuration Release -r win-x64 -o ./releases/windows

      - name: Publish for Linux
        run: dotnet publish --configuration Release -r linux-x64 -o ./releases/linux

      - name: Publish for macOS
        run: dotnet publish --configuration Release -r osx-x64 -o ./releases/macos

      - name: Create archives
        run: |
          cd releases
          zip -r sql-query-analyzer-windows.zip windows
          tar -czf sql-query-analyzer-linux.tar.gz linux
          tar -czf sql-query-analyzer-macos.tar.gz macos

      - name: Upload release artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./releases/sql-query-analyzer-windows.zip
          asset_name: sql-query-analyzer-windows.zip
          asset_content_type: application/zip
